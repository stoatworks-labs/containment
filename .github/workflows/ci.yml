name: ci

# Both platforms on every push and pull request, so a Dependabot bump has a
# status check to gate on and a GLEW-shaped break -- which macOS is
# structurally blind to, because macOS never links GLEW -- is caught before a
# tag. There is no Linux job: the CMakeLists branches on APPLE and WIN32.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 -- the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific. tools/verify.sh builds and lipos
        # the universal bundle on the dev Mac.
        #
        # CONTAINMENT_BUILD_TOOLS is ON here where the release build turns it
        # OFF: cttest is the only place the physics is written down as a
        # number, so compiling and running it is most of the value.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCONTAINMENT_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Parameters
        # No GL needed, so this one cannot be a runner problem.
        run: ./build/cttest --list

      - name: Shaders
        # A GitHub macOS runner cannot create an accelerated GL context, so
        # this is where CI looks at the GLSL: every shipped program through
        # glslc, by the same script verify.sh runs.
        run: |
          brew install shaderc
          tools/check-shaders.sh build/cttest

      - name: Offline
        # --offline is every check that needs no GL -- the names, the presets,
        # the Brio-Wu reference, the coils' vacuum field -- and their negative
        # controls, defined in cttest's main(), not listed here, so a new one
        # cannot be silently left out. It says loudly what it did not run.
        # Everything about the plasma itself is GPU code and is in the next
        # step, and in tools/verify.sh on the dev Mac.
        timeout-minutes: 5
        run: ./build/cttest --offline

      - name: Rendered
        # If the runner can make a software 4.1 context this runs at 320x180,
        # the raster verify.sh also runs locally; if it cannot, --allow-no-gl
        # turns the failure into a loud SKIP rather than a red build that says
        # nothing about the plugin. Only --state: Apple's software renderer,
        # forced on the dev Mac (CT_RENDERER=software), took 2.5 minutes for
        # --state's three frames -- about 50 s a frame at the default Detail --
        # so the physics checks (thousands of substeps) and the control sweep
        # (hundreds of 90-frame renders) would run for days. They run on the
        # dev Mac's GPU, in tools/verify.sh, at both rasters.
        timeout-minutes: 20
        run: ./build/cttest --state --size 320x180 --allow-no-gl

      - uses: actions/upload-artifact@v4
        with:
          name: containment-macos-arm64
          path: build/*.bundle
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        # The toolchain path MUST stay double-quoted: a `run:` step on Windows
        # is PowerShell, and unquoted this expands to nothing.
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DCONTAINMENT_BUILD_TOOLS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: containment-windows-x86_64
          path: build/Release/*.dll
          if-no-files-found: error
