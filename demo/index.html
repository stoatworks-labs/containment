    <main id="demo">
      <noscript>
        <h1>Containment</h1>
        <p>
          An FFGL effect that turns your clip into a ball of hot plasma held in
          a magnetic bottle. The plasma follows 2.5-D compressible ideal
          magnetohydrodynamics, solved on the GPU every frame, and the bottle is
          the closed-form field of real coils standing outside the picture. The
          ball swells against the field, rings, writhes, leaks through the cusps
          and breaks into fingers, and if you quench the coils it goes up as a
          fireball.
        </p>
        <p>
          This demo runs the plugin's own MHD solver in your browser, so it
          needs JavaScript and WebGL2 with float render targets. The plugin
          itself, its source and its downloads are on
          <a href="https://github.com/stoatworks-labs/containment">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/containment/">Project page and downloads</a></li>

        </ul>
